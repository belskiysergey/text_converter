<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Преобразование текста</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Преобразование текста</h1>

        <input type="text" id="textInput" class="text-input" placeholder="Введите текст и нажмите Enter..." autocomplete="off" autofocus>

        <p class="hint">
            Первая буква каждого слова станет заглавной
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
